name: Build and Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate and build (Node.js 22)
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro check
        run: pnpm check

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Run API utility tests
        run: pnpm test

      - name: Build site and Second Brain
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke and accessibility tests
        run: pnpm test:e2e

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Run Lighthouse CI
        run: pnpm test:lighthouse

      - name: Upload browser quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
