# yaml-language-server: $schema=quartz/plugins/quartz-plugins.schema.json

# Quartz is isolated in brain/. Nothing in this file changes the Astro blog.
configuration:
  pageTitle: "Thanh Tùng's Second Brain"
  pageTitleSuffix: " · Second Brain"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: vercel
  locale: vi-VN
  baseUrl: www.thanhtung0209.com/brain
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .smart-env
    - "*.base"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f1fafa"
        lightgray: "#d9ebea"
        gray: "#90aaa8"
        darkgray: "#385654"
        dark: "#102725"
        secondary: "#087f82"
        tertiary: "#c44f7d"
        highlight: rgba(8, 127, 130, 0.12)
        textHighlight: "#fff23688"
      darkMode:
        light: "#071716"
        lightgray: "#18302e"
        gray: "#66817f"
        darkgray: "#c7dcda"
        dark: "#eef9f8"
        secondary: "#4bc3c5"
        tertiary: "#ef88ad"
        highlight: rgba(75, 195, 197, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  # Markdown and Obsidian syntax.
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true

  # Generated pages and public assets.
  - source: github:quartz-community/alias-redirects
    enabled: true
    options:
      enableCaseRedirects: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  # Quartz Head imports this plugin's type even when image generation is off.
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true

  # Navigation and reading tools.
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Về blog: https://www.thanhtung0209.com/
        Kho bài: https://www.thanhtung0209.com/archive/
        Email: https://mail.google.com/mail/?view=cm&fs=1&to=thanhtungbtlg@gmail.com

# Notes already contain their own H1, so content pages hide Quartz's generated
# article title. Folder and tag pages still keep their generated title.
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - article-title
        - note-properties
    folder:
      exclude:
        - reader-mode
        - note-properties
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - note-properties
      positions:
        right: []
